<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PFMS – Verbindungsdiagnose</title><style>:root{color-scheme:dark;font-family:system-ui;background:#111;color:#f5f1e8}body{margin:0;padding:24px;max-width:760px;margin:auto}main{border:1px solid #927744;border-radius:18px;padding:24px;background:#1b1b1b}h1{color:#e6c77b}p{line-height:1.55}.muted{color:#bbb}button{border:0;border-radius:12px;padding:14px 20px;background:#d5b66c;color:#17130b;font-weight:700;font-size:16px}li{margin:12px 0;overflow-wrap:anywhere}.ok{color:#9be0aa}.bad{color:#ff9c9c}</style><script src="pfms-config.js?v=20261116-connection-test-2" defer></script></head><body><main><h1>PFMS – Verbindungsdiagnose</h1><p class="muted">Dieser Test übermittelt kein Passwort und meldet dich nicht an. Er prüft nur die öffentliche Verbindung dieses Browsers zum konfigurierten Supabase-Projekt.</p><button id="run" type="button">Verbindung jetzt prüfen</button><ol id="results"><li>Bereit für den Verbindungstest.</li></ol><p id="summary" aria-live="polite"></p></main><script>
(()=>{const button=document.getElementById('run'),list=document.getElementById('results'),summary=document.getElementById('summary');const add=(a,b,k)=>{const li=document.createElement('li');li.className=k||'';li.textContent=a+' – '+b;list.appendChild(li)};const req=async(url,options={})=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{return await fetch(url,{...options,cache:'no-store',signal:c.signal})}finally{clearTimeout(t)}};button.addEventListener('click',async()=>{button.disabled=true;list.replaceChildren();summary.textContent='Prüfung läuft …';let failures=0;try{const cfg=window.PFMS_CONFIG;if(!cfg?.supabaseUrl||!cfg?.supabaseKey)throw new Error('PFMS_CONFIG fehlt oder ist unvollständig.');const expected='oolvpbzbqioijoazsoun',host=new URL(cfg.supabaseUrl).hostname,hostMatch=host===expected+'.supabase.co',refValue=String(cfg.projectRef||''),refMatch=refValue===expected,match=hostMatch&&refMatch;add('Staging-Zuordnung','Build-Ziel '+String(cfg.buildTarget||'unbekannt')+', Projektkennung '+refValue+' (Länge '+refValue.length+', passend: '+refMatch+'), Host '+host+' (passend: '+hostMatch+')',match?'ok':'bad');if(!match)throw new Error('Staging-Konfiguration gehört nicht zum erwarteten Projekt. Host- und Kennungsprüfung werden getrennt angezeigt.');const keyOk=cfg.supabaseKey.startsWith('sb_publishable_')||cfg.supabaseKey.split('.').length===3;add('Öffentlicher Schlüssel',keyOk?'Öffentliches Schlüssel-Format erkannt; Wert wird nicht angezeigt.':'Unbekanntes Format; Wert wird nicht angezeigt.',keyOk?'ok':'bad');if(!keyOk)failures++;for(const path of ['/auth/v1/health','/auth/v1/settings']){try{const r=await req(cfg.supabaseUrl+path,{method:'GET',headers:{apikey:cfg.supabaseKey,Accept:'application/json'}}),body=(await r.text()).slice(0,350);if(r.ok)add(path,'HTTP '+r.status+' – '+body,'ok');else{failures++;add(path,'HTTP '+r.status+' – '+body,'bad')}}catch(e){failures++;add(path,e.name==='AbortError'?'Zeitüberschreitung nach 12 Sekunden':e.name+': '+e.message,'bad')}}summary.className=failures?'bad':'ok';summary.textContent=failures?'Mindestens eine Prüfung fehlgeschlagen. Bitte Screenshot senden.':'Beide Endpunkte sind aus diesem Browser mit dem Staging-Schlüssel erreichbar.'}catch(e){failures++;summary.className='bad';summary.textContent='Diagnose abgebrochen: '+e.message}finally{button.disabled=false}})})();</script></body></html>
