name: PFMS quality checks

on:
  push:
    branches:
      - main
      - feature/pfss-complete-platform-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfms-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Syntax and project smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run project checks
        run: |
          npm test

  edge-functions:
    name: Type-check Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/username-login/index.ts
          deno check --node-modules-dir=auto supabase/functions/r2-connection-check/index.ts
