name: PFSS database backup

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are UTC. Run at both candidate hours and continue
    # only when the local Berlin time is 03:00 (handles CET/CEST).
    - cron: "0 1,2 * * *"

permissions:
  contents: read

concurrency:
  group: pfss-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Berlin backup time
        id: timecheck
        shell: bash
        run: |
          HOUR="$(TZ=Europe/Berlin date +%H)"
          if [ "$HOUR" = "03" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client and AWS CLI
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      - name: Create and encrypt PostgreSQL dump
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.PFSS_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.PFSS_BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing PFSS_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "Missing PFSS_BACKUP_ENCRYPTION_PASSPHRASE"; exit 1; }
          mkdir -p backup
          FILE="pfss-db-$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file "backup/$FILE"
          pg_restore --list "backup/$FILE" >/dev/null

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "backup/$FILE" -out "backup/$FILE.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          # Authenticate the ciphertext before any decryption. The HMAC key is
          # domain-separated from the PBKDF2 key used by OpenSSL encryption.
          python3 - "backup/$FILE.enc" <<'PY'
          import hashlib
          import hmac
          import os
          import sys

          passphrase = os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()
          key = hashlib.sha256(b"PFSS-R2-BACKUP-HMAC-v1:" + passphrase).digest()
          digest = hmac.new(key, digestmod=hashlib.sha256)
          with open(sys.argv[1], "rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          with open(sys.argv[1] + ".hmac", "w", encoding="ascii") as manifest:
              manifest.write(digest.hexdigest() + "\n")
          PY

          # Verify the HMAC before decrypting and parsing the archive.
          python3 - "backup/$FILE.enc" "backup/$FILE.enc.hmac" <<'PY'
          import hashlib
          import hmac
          import os
          import sys

          passphrase = os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()
          key = hashlib.sha256(b"PFSS-R2-BACKUP-HMAC-v1:" + passphrase).digest()
          digest = hmac.new(key, digestmod=hashlib.sha256)
          with open(sys.argv[1], "rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          with open(sys.argv[2], "r", encoding="ascii") as manifest:
              expected = manifest.read().strip()
          if not hmac.compare_digest(digest.hexdigest(), expected):
              raise SystemExit("Backup HMAC verification failed; refusing to decrypt.")
          print("Backup HMAC verification passed.")
          PY

          VERIFY_FILE="backup/restore-check-$FILE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "backup/$FILE.enc" -out "$VERIFY_FILE" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          pg_restore --list "$VERIFY_FILE" >/dev/null
          rm "$VERIFY_FILE" "backup/$FILE"
          echo "BACKUP_FILE=$FILE.enc" >> "$GITHUB_ENV"
          echo "Backup archive, HMAC and encrypted restore verification passed."

      - name: Upload encrypted backup to Cloudflare R2
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing R2_ENDPOINT"; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Missing R2_BUCKET_NAME"; exit 1; }
          aws s3 cp "backup/$BACKUP_FILE" \
            "s3://$R2_BUCKET_NAME/database/daily/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "backup/$BACKUP_FILE.hmac" \
            "s3://$R2_BUCKET_NAME/database/daily/$BACKUP_FILE.hmac" \
            --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors

      - name: Verify uploaded backup exists
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "database/daily/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
          aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "database/daily/$BACKUP_FILE.hmac" \
            --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null
          echo "Encrypted database backup and HMAC manifest uploaded and verified."
