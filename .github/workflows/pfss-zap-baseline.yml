name: PFSS OWASP ZAP passive baseline (staging only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pfss-zap-staging-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Passive ZAP scan – staging only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce fixed staging target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="https://pfss-staging.onrender.com/"
          test "$TARGET" = "https://pfss-staging.onrender.com/"
          echo "Only the fixed PFSS staging origin is in scope."

      - name: Run OWASP ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://pfss-staging.onrender.com/"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: "-m 2 -J report_json.json -r report.html -w report.md"
          artifact_name: "pfss-zap-staging-baseline"
          allow_issue_writing: false
          fail_action: false
