name: PFSS quality checks

on:
  push:
    branches:
      - main
      - foundation/permissions-v1
  pull_request:
    branches:
      - main
      - foundation/permissions-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfss-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript, HTML IDs and local resources
        run: node scripts/pfss-validate.mjs
